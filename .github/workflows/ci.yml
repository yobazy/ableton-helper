name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --frozen

      # tests/test_audio_service_live.py skips itself unless ABLETON_HELPER_LIVE_AUDIO is set
      # (it needs the audio-analysis service on the home server), so CI never sets it.
      - name: Run tests
        run: uv run pytest
