[project]
name = "ableton-helper"
version = "0.1.0"
description = "AI arrangement assistant for Ableton Live (MCP server + Remote Script)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
ableton-helper-mcp = "ableton_helper.server:main"
ableton-helper = "ableton_helper.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ableton_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
